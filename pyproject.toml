[project]
name = "fastchu"
version = "0.1.0"
description = "FastChu —— 中二节奏（CHUNITHM）查歌 QQ 机器人，只使用落雪查分器公共接口"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # 端到端测试用：在真实 NoneBot 运行时里驱动命令
    "nonebug>=0.4",
]

[project.scripts]
fastchu = "fastchu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastchu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 两个套件都跑：tests = 纯逻辑单测，tests_e2e = 真实 NoneBot 运行时的命令级测试
testpaths = ["tests", "tests_e2e"]
filterwarnings = ["ignore::DeprecationWarning"]
